name: Build rootfs

on:
  push:
    branches: [main]
    paths:
      - "300-rootfs-kubevirt/**"
      - ".github/workflows/build-rootfs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kubevirt-playground
  KUBEVIRT_VERSION: v1.9.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cplane, node, dev-machine]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: 300-rootfs-kubevirt
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            KUBEVIRT_VERSION=${{ env.KUBEVIRT_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.target }}
            ${{ env.IMAGE }}:${{ matrix.target }}-${{ env.KUBEVIRT_VERSION }}
            ${{ env.IMAGE }}:${{ matrix.target }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
