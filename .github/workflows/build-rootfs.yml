name: Build rootfs

on:
  push:
    branches: [main]
    paths:
      - "300-rootfs-kubevirt/**"
      - ".github/workflows/build-rootfs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kubevirt-playground
  KUBEVIRT_VERSION: v1.9.1
  CDI_VERSION: v1.66.1
  KUBEVIRT_MANAGER_VERSION: 1.5.4
  PACKER_VERSION: 1.16.2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cplane, node, dev-machine]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: 300-rootfs-kubevirt
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            KUBEVIRT_VERSION=${{ env.KUBEVIRT_VERSION }}
            CDI_VERSION=${{ env.CDI_VERSION }}
            KUBEVIRT_MANAGER_VERSION=${{ env.KUBEVIRT_MANAGER_VERSION }}
            PACKER_VERSION=${{ env.PACKER_VERSION }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.target }}
            ${{ env.IMAGE }}:${{ matrix.target }}-${{ env.KUBEVIRT_VERSION }}
            ${{ env.IMAGE }}:${{ matrix.target }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
