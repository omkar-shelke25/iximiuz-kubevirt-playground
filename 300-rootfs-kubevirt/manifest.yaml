kind: playground
name: kubevirt-k3s-6fac2500
base: flexbox
title: KubeVirt on K3s
description: Multi-node K3s cluster with KubeVirt, CDI and the KubeVirt Manager web UI preinstalled. Run virtual machines next to containers.
cover: /content/files/playgrounds/kubevirt-k3s-6fac2500/__static__/kubevirt-stacked-color.svg?v=1791005419836
