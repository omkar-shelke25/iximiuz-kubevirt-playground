# KubeVirt configuration for an iximiuz Labs playground.
#
# - useEmulation: playground VMs run on Firecracker, which has no nested
#   virtualization, so there is no /dev/kvm. VMs run with QEMU software emulation.
# - infra.replicas: one virt-api and one virt-controller instead of two,
#   to save memory on the small playground control plane node.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      useEmulation: true
      featureGates: []
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
  infra:
    replicas: 1
